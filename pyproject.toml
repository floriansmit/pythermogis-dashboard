[project]
name = "pythermogis-dashboard"
version = "0.1.0"
description = "Project-based Streamlit dashboard for Pythermogis workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "dask>=2025.5.1,<2026",
    "geopandas>=1.0,<2",
    "geopy>=2.4,<3",
    "install-jdk==1.1.0",
    "jpype1>=1.5.2,<2",
    "matplotlib>=3.9,<4",
    "netcdf4>=1.7,<2",
    "numpy>=2,<3",
    "pandas>=2.2.3,<3",
    "plotly>=6,<7",
    "pydantic>=2.12,<3",
    "pygridsio==1.1.4",
    "pygridsio3d>=0.1.0",
    "pyproj>=3.7,<4",
    "pythermogis==3.0.3",
    "pytz>=2024.1,<2025",
    "pyyaml>=6,<7",
    "rioxarray>=0.17,<0.18",
    "streamlit>=1.45,<2",
    "xarray==2024.9.0",
]

[project.optional-dependencies]
desktop = [
    "pyinstaller>=6.10,<7",
    "pywebview>=5.4,<7",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tno-pythermogis"
url = "https://ci.tno.nl/gitlab/api/v4/projects/18271/packages/pypi/simple"
explicit = true

[tool.uv.sources]
pythermogis = { index = "tno-pythermogis" }
